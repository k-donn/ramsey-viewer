<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Ramsey Graph Visualizer</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Bootstrap CSS -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<!-- D3.js -->
		<script src="https://d3js.org/d3.v7.min.js"></script>
		<style>
			.vertex {
				stroke: #333;
				stroke-width: 2px;
			}
			.edge {
				stroke-width: 3px;
				opacity: 0.7;
			}
			.highlight-k-red {
				stroke-width: 6px;
				opacity: 1;
			}
			.highlight-k-blue {
				stroke-width: 8px;
				opacity: 1;
			}
			.vertex-label {
				font-weight: bold;
				font-size: 1.2em;
				fill: #222;
			}
		</style>
	</head>
	<body class="bg-light">
		<div class="container py-4">
			<h1 class="mb-4">Ramsey Complete Graph Visualizer</h1>
			<form id="graphForm" class="mb-4">
				<div class="row g-2">
					<div class="col-auto">
						<select class="form-select" id="ramseyType" required>
							<option value="r33">R(3,3)</option>
							<option value="r34" selected>R(3,4)</option>
							<option value="r35">R(3,5)</option>
							<option value="r36">R(3,6)</option>
							<option value="r37">R(3,7)</option>
							<option value="r38">R(3,8)</option>
							<option value="r39">R(3,9)</option>
							<option value="r44">R(4,4)</option>
							<option value="r45">R(4,5)</option>
						</select>
					</div>
					<div class="col-auto">
						<div class="input-group">
							<div class="input-group-text">#</div>
							<input
								type="text"
								class="form-control"
								id="graphId"
								placeholder="Enter graph id (e.g. 1)"
							/>
						</div>
					</div>
					<div class="col-auto">
						<button class="btn btn-primary" type="submit">
							Load Graph
						</button>
					</div>
				</div>
			</form>
			<div id="legend" class="my-3">
				<span class="badge bg-danger">G</span>
				<span class="badge bg-primary">G complement</span>
			</div>
			<div id="graphArea" class="bg-white rounded shadow p-3 text-center">
				<svg id="graphSvg" width="700" height="700"></svg>
			</div>
		</div>
		<script>
			"use strict";
			const width = 700,
				height = 700,
				radius = 270,
				vertexRadius = 20;

			const vertsLookup = {
				r33: 6,
				r34: 9,
				r35: 14,
				r36: 18,
				r37: 23,
				r38: 28,
				r39: 36,
				r44: 18,
				r45: 25,
			};

			function decimalToBinaryString(n, k) {
				return n.toString(2).padStart(k, "0");
			}

			function findKmn(edges, vertsCount, m, n) {
				// Build adjacency matrices for red and blue edges
				const redAdj = Array.from({ length: vertsCount }, () =>
					Array(vertsCount).fill(false)
				);
				const blueAdj = Array.from({ length: vertsCount }, () =>
					Array(vertsCount).fill(false)
				);
				edges.forEach((e) => {
					if (e.color === "red") {
						redAdj[e.source][e.target] = true;
						redAdj[e.target][e.source] = true;
					} else {
						blueAdj[e.source][e.target] = true;
						blueAdj[e.target][e.source] = true;
					}
				});

				// Returns the vertices part of the clique
				function findClique(adj, size) {
					function helper(start, clique) {
						if (clique.length === size) return clique.slice();
						for (let v = start; v < vertsCount; v++) {
							if (clique.every((u) => adj[u][v])) {
								const found = helper(v + 1, clique.concat(v));
								if (found) return found;
							}
						}
						return null;
					}
					return helper(0, []);
				}

				const redKVerts = findClique(redAdj, m);
				const blueKVerts = findClique(blueAdj, n);
				const redKEdges = [];
				const blueKEdges = [];

				for (let fromIdx = 0; fromIdx < redKVerts?.length; fromIdx++) {
					for (
						let toIdx = fromIdx + 1;
						toIdx < redKVerts.length;
						toIdx++
					) {
						redKEdges.push({
							source: redKVerts[fromIdx],
							target: redKVerts[toIdx],
						});
					}
				}

				for (let fromIdx = 0; fromIdx < blueKVerts?.length; fromIdx++) {
					for (
						let toIdx = fromIdx + 1;
						toIdx < blueKVerts.length;
						toIdx++
					) {
						blueKEdges.push({
							source: blueKVerts[fromIdx],
							target: blueKVerts[toIdx],
						});
					}
				}

				return { redKEdges, blueKEdges };
			}

			function drawGraph(ramseyType, graphId) {
				const vertsCount = vertsLookup[ramseyType];

				const edgesCount = (vertsCount * (vertsCount - 1)) / 2;

				const colorBits = decimalToBinaryString(graphId, edgesCount);

				console.log(colorBits);

				const svg = d3.select("#graphSvg");
				svg.selectAll("*").remove();

				const centerX = width / 2;
				const centerY = height / 2;

				// Calculate vertex positions in a circle
				const vertices = d3.range(vertsCount).map((d, i) => {
					const angle = (2 * Math.PI * i) / vertsCount - Math.PI / 2;
					return {
						id: i,
						x: centerX + radius * Math.cos(angle),
						y: centerY + radius * Math.sin(angle),
					};
				});

				// Generate all edges for a complete graph
				const edges = [];
				let edgeId = 0;
				for (let fromVert = 0; fromVert < vertsCount; fromVert++) {
					for (
						let toVert = fromVert + 1;
						toVert < vertsCount;
						toVert++
					) {
						edges.push({
							source: fromVert,
							target: toVert,
							color: parseInt(
								colorBits[colorBits.length - 1 - edgeId]
							)
								? "red"
								: "blue",
						});
						edgeId++;
					}
				}

				const cliques = findKmn(
					edges,
					vertsCount,
					parseInt(ramseyType[1]),
					parseInt(ramseyType[2])
				);

				for (let edgeIdx = 0; edgeIdx < edges.length; edgeIdx++) {
					const isBluePart = cliques.blueKEdges.some(
						(e) =>
							e.source === edges[edgeIdx].source &&
							e.target === edges[edgeIdx].target
					);
					const isRedPart = cliques.redKEdges.some(
						(e) =>
							e.source === edges[edgeIdx].source &&
							e.target === edges[edgeIdx].target
					);
					if (isBluePart) {
						edges[edgeIdx]["k_blue"] = true;
						vertices[edges[edgeIdx].source]["k_blue"] = true;
					}
					if (isRedPart) {
						edges[edgeIdx]["k_red"] = true;
						vertices[edges[edgeIdx].source]["k_red"] = true;
					}
				}

				// Draw edges
				svg.selectAll(".edge")
					.data(edges)
					.enter()
					.append("line")
					.attr(
						"class",
						(d) =>
							`edge ${d.k_red ? "highlight-k-red" : ""} ${
								d.k_blue ? "highlight-k-blue" : ""
							}`
					)
					.attr("x1", (d) => vertices[d.source].x)
					.attr("y1", (d) => vertices[d.source].y)
					.attr("x2", (d) => vertices[d.target].x)
					.attr("y2", (d) => vertices[d.target].y)
					.attr("stroke", (d) => d.color);

				// Draw vertices
				svg.selectAll(".vertex")
					.data(vertices)
					.enter()
					.append("circle")
					.attr("class", "vertex")
					.attr("cx", (d) => d.x)
					.attr("cy", (d) => d.y)
					.attr("r", vertexRadius)
					.attr("fill", "#fff");

				// Draw vertex labels
				svg.selectAll(".vertex-label")
					.data(vertices)
					.enter()
					.append("text")
					.attr("class", "vertex-label")
					.attr("x", (d) => d.x)
					.attr("y", (d) => d.y + 6)
					.attr("text-anchor", "middle")
					.text((d) => d.id + 1);
			}

			document
				.getElementById("graphForm")
				.addEventListener("submit", function (event) {
					event.preventDefault();
					const ramseyType =
						document.getElementById("ramseyType").value;
					const graphId = parseInt(
						document.getElementById("graphId").value.trim()
					);
					drawGraph(ramseyType, graphId);
				});
		</script>
	</body>
</html>
